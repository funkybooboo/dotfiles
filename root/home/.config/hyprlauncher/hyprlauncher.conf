# hyprlauncher config -- https://github.com/hyprwm/hyprlauncher
# Default window_size is 400x260. Enlarged to 820x720 for a roomy launcher
# with big readable rows (each row = font_size*2+4 px tall, so a larger
# font also makes app icons bigger -- icons are 0.7*row_height).
ui:window_size = 820, 720

# Show all apps immediately on open instead of an empty box.
general:show_apps_on_open = 1
