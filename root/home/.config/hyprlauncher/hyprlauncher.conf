# hyprlauncher config -- https://github.com/hyprwm/hyprlauncher
# Default window_size is 400x260. Widened/tallened to 620x560 so the
# single-column app list has proper launcher proportions (the old 900x700
# was too wide and looked sparse).
ui:window_size = 620, 560

# Show all apps immediately on open instead of an empty box.
general:show_apps_on_open = 1
