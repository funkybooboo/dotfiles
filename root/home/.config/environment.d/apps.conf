EDITOR=nvim
VISUAL=nvim
PAGER=nvimpager
MANPAGER=nvimpager
BROWSER=librewolf
# TERM is deliberately NOT set here. environment.d applies to the whole systemd
# user session, so a value set here leaks into every user service and into any
# terminal that does not set its own -- and TERM must describe the terminal
# actually attached, which only the emulator knows. ghostty sets it per-session
# already, so this was both redundant and a way to hand the wrong terminfo to
# something running without a tty.
SUDO_EDITOR=nvim
BAT_THEME=Catppuccin Mocha
MANROFFOPT=-c
LESSHISTFILE=-
PYTHONSTARTUP=/home/nate/.config/python/pythonrc
XCURSOR_SIZE=24
HYPRCURSOR_SIZE=24
GDK_BACKEND=wayland,x11,*
QT_QPA_PLATFORM=wayland;xcb
MOZ_ENABLE_WAYLAND=1
MOZ_LEGACY_PROFILES=1
ELECTRON_OZONE_PLATFORM_HINT=wayland
XDG_SESSION_TYPE=wayland
XDG_CURRENT_DESKTOP=Hyprland
XDG_SESSION_DESKTOP=Hyprland
# mermaid-cli (mmdc) -- use the system chromium instead of puppeteer's bundled
# download (~150MB). chromium is installed by 000303-browsers.sh.
PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
PUPPETEER_SKIP_DOWNLOAD=1