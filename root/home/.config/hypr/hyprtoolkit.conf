# hyprtoolkit palette -- https://github.com/hyprwm/hyprtoolkit
# Catppuccin Mocha, tuned for hyprlauncher. Of the palette colors, only
# background / accent / text are actually read by hyprlauncher:
#   background        -> popup fill
#   accent            -> popup border, divider, active-row highlight
#   text              -> search text, result labels, scrollbar thumb
# (base / alternate_base / bright_text / link_text / accent_secondary are
#  kept for other hyprtoolkit apps but unused by the launcher.)
#
# Popup is mantle (#181825) -- one step darker than the desktop base
# (#1e1e2e) so the launcher reads as a distinct floating surface instead
# of blending into the wallpaper. Accent stays mauve to match waybar's
# active workspace + Hyprland's group bar.

background = rgb(181825)
base = rgb(1e1e2e)
alternate_base = rgb(181825)
text = rgb(cdd6f4)
bright_text = rgb(f5e0dc)
link_text = rgb(89b4fa)
accent = rgb(cba6f7)
accent_secondary = rgb(f5c2e7)

font_family = JetBrainsMono Nerd Font
font_family_monospace = JetBrainsMono Nerd Font
icon_theme = Adwaita

# Body text in the launcher. Modest bump from the 11pt default for
# readability without making rows chunky (row height = font_size*2+4).
font_size = 13
small_font_size = 11

# Match Hyprland's rounding = 10 for the popup; result pills slightly
# rounder (6) for a softer look than the 5 default.
rounding_large = 10
rounding_small = 6
