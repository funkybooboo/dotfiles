windowrule[suppress_event maximize] = class:.*

windowrule[tag +default-opacity] = class:.*

windowrule[opacity 0.97 0.9] = tag:default-opacity

windowrule[opacity 1.0 1.0] = class:^(mpv)$
windowrule[opacity 1.0 1.0] = class:^(vlc)$
windowrule[opacity 1.0 1.0] = class:^(firefox)$
windowrule[opacity 1.0 1.0] = class:^(chromium)$
windowrule[opacity 1.0 1.0] = class:^(google-chrome)$
windowrule[opacity 1.0 1.0] = class:^(obs)$

windowrule[workspace special silent] = title:^(is sharing your screen)

windowrule[nofocus] = class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

windowrule[float] = class:^(imv)$
windowrule[float] = class:^(mpv)$
windowrule[float] = class:^(pavucontrol)$
windowrule[float] = class:^(blueman-manager)$
# Apps launched via hypr-float-launch keybinds/waybar icons that don't run
# inside ghostty (so they don't get the hypr-float-<pid> title marker).
# Float them at creation by class so there's no tile-then-float flash;
# hypr-float-launch then applies the consistent 85%x90% centered size.
windowrule[float] = initialClass:^(thunar)$
windowrule[size 85% 90%] = initialClass:^(thunar)$
windowrule[move 50% 50%] = initialClass:^(thunar)$, center
windowrule[float] = initialClass:^(Signal|signal)$
windowrule[size 85% 90%] = initialClass:^(Signal|signal)$
windowrule[move 50% 50%] = initialClass:^(Signal|signal)$, center
windowrule[float] = initialClass:^(nwg-displays)$
windowrule[size 85% 90%] = initialClass:^(nwg-displays)$
windowrule[move 50% 50%] = initialClass:^(nwg-displays)$, center
windowrule[float] = class:^(thunar)$, title:^(Progress|Confirm|Warning|Question)
windowrule[size 875 600] = class:^(imv)$
windowrule[move 50% 50%] = class:^(imv)$, center
windowrule[float] = title:^(Open|Save|File|Folder)$

# Windows launched by hypr-float-launch get --title=hypr-float-<pid> so they
# float IMMEDIATELY at creation time (no tiled-then-float flash). hyprlauncher
# and other apps that don't use this title stay tiled.
windowrule[float] = initialTitle:^(hypr-float.*)$

windowrule[tag +noidle] = class:^(mpv)$
windowrule[tag +noidle] = class:^(zoom)$
windowrule[idleinhibit always] = tag:noidle