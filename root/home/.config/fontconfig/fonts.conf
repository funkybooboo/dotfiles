<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>

  <!-- Disable font ligatures globally for all apps that honor fontconfig's
       `features` property (GTK/Qt apps, browsers, LibreOffice, etc.).
       Terminals like Ghostty do not read this; see ghostty/config for the
       terminal-side disable.
       liga=standard ligatures, calt=contextual alternates,
       dlig=discretionary ligatures, clig=contextual ligatures.
       A leading '-' disables a feature (OpenType convention). -->
  <match target="font">
    <edit name="features" mode="assign" binding="strong">
      <string>-liga</string>
      <string>-calt</string>
      <string>-dlig</string>
      <string>-clig</string>
    </edit>
  </match>
</fontconfig>