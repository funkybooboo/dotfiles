# herdr -- agent multiplexer (see migrations/000237-herdr.sh)
#
# The keymap is ported from omarchy's config/herdr/config.toml, which mirrors the
# tmux config in .config/tmux/tmux.conf. That port is faithful because this
# repo's tmux config descends from omarchy's -- same C-Space prefix, same split,
# focus, resize, tab and session bindings -- so the mapping below is the same
# muscle memory, not a stranger's:
#   tmux session -> herdr workspace, window -> tab, pane -> pane.

# One-time chooser; absent also means "show onboarding".
onboarding = false

[theme]
# herdr's built-in catppuccin, matching ghostty's own "Catppuccin Mocha". omarchy
# used name = "terminal" (inherit the host palette) and then needed a
# [theme.custom] panel_bg = "black" override to force the panel dark enough to
# read; naming the theme directly removes the need for that workaround.
name = "catppuccin"
auto_switch = false

[terminal]
# Matches -c "#{pane_current_path}" on every tmux split, window, and session.
new_cwd = "follow"

[keys]
prefix = "ctrl+space"

# Config and help
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+["

# Panes
split_horizontal = ["prefix+h", "alt+enter"]
split_vertical = ["prefix+v", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"

focus_pane_left = "ctrl+alt+left"
focus_pane_down = "ctrl+alt+down"
focus_pane_up = "ctrl+alt+up"
focus_pane_right = "ctrl+alt+right"

resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

# Like resize-pane on C-M-S-arrows
resize_pane_left = "ctrl+alt+shift+left"
resize_pane_down = "ctrl+alt+shift+down"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"

# No tmux equivalent; herdr's default prefix+shift+p is taken by previous session
rename_pane = "prefix+shift+o"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+k"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]

# Like swap-window -t -1/+1 on M-S-Left/Right
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

[ui]
# Catppuccin mauve, the same accent tmux uses for status-left and the current
# window. omarchy set "blue" here because ITS tmux drew status-left on blue;
# ours is mauve, so faithfulness to that tmux parity means a different value.
# accent takes hex or the named set cyan/blue/magenta -- there is no "mauve".
accent = "#cba6f7"

# Attention queue rather than grouping by space.
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
status_indicators = "dots"

# tmux drew single-line dividers between adjacent panes and no outer frame
pane_gaps = false
pane_outer_borders = false

# tmux had no scrollbar column beside its panes
pane_scrollbars = false

# kill-window and kill-session never asked
confirm_close = false

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# set -g mouse on
mouse_capture = true

# status-right had the zoom flag followed by #h
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]

# set -g set-titles on / set-titles-string '#h:#W', where tmux's #W was the
# basename of the pane cwd. This is what Hyprland shows in the group bar, and it
# resolves on the server so remote sessions name the remote host.
window_title = "{hostname}: {workspace}"

[ui.toast]
# Route notifications to mako rather than drawing them inside herdr.
delivery = "system"

[ui.sound]
enabled = false
