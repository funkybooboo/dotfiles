# Rootless podman storage config -- overlay via fuse-overlayfs.
#
# Why overlay + fuse-overlayfs (not vfs, not kernel overlay):
#   - vfs copies every layer verbatim (slow, disk-hungry). overlay shares
#     layers, so builds/runs are much faster and cheaper on disk.
#   - kernel overlay-over-btrfs fails here: /home is btrfs without userxattr=1,
#     so the kernel rejects unprivileged overlayfs. fuse-overlayfs is a
#     userspace (FUSE) overlay implementation -- it sidesteps the kernel
#     restriction entirely and works rootless.
#   - The btrfs driver is not an option rootless (btrfs subvolume ioctls need
#     real CAP_SYS_ADMIN on the superblock, not a user-namespace mapping).
#
# Requires the fuse-overlayfs package (installed by migration 000204) and
# /dev/fuse accessible (mode 666, default on Arch).
#
# A driver switch REQUIRES a fresh store: `podman system reset -f` (or wipe
# ~/.local/share/containers/storage) before the first run with the new driver,
# because the on-disk store is initialized for one driver only.
[storage]
driver = "overlay"

[storage.options]
mount_program = "/usr/bin/fuse-overlayfs"
