# Rootless podman storage config.
#
# The btrfs driver needs real root (btrfs subvolume ioctls require
# CAP_SYS_ADMIN on the actual superblock, not a user-namespace mapping),
# so rootless podman ignores `driver = btrfs` and falls back to overlay.
# Overlay-over-btrfs then fails because the /home btrfs mount is not
# mounted with userxattr=1, and fuse-overlayfs is not installed.
#
# vfs works everywhere rootless with no extra deps -- it just copies
# layer contents instead of overlaying them. Slower and more disk-hungry
# than overlay, but reliable. To switch back to fast overlay later,
# install fuse-overlayfs (pacman or nix) and set `driver = "overlay"`
# with `mount_program = "/usr/bin/fuse-overlayfs"` under [storage.options].
[storage]
driver = "vfs"
