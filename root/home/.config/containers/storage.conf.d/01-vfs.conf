# Override the Arch package drop-in
# /usr/share/containers/storage.conf.d/00-storage-arch.conf which forces
# driver = "overlay". Drop-in files in this .d directory are merged after
# the system drop-in, so this wins. vfs is used because rootless overlay
# over btrfs fails here (no userxattr on /home, no fuse-overlayfs).
[storage]
driver = "vfs"
