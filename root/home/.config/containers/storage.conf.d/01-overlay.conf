# Override the Arch package drop-in
# /usr/share/containers/storage.conf.d/00-storage-arch.conf which sets
# driver = "overlay" with NO mount_program -- that would try kernel overlay
# over btrfs and fail (no userxattr on /home). Drop-in files in this .d
# directory are merged after the system drop-in, so this wins: we keep
# driver = overlay but route the mount through fuse-overlayfs (userspace),
# which works rootless on btrfs without userxattr.
#
# mount_program sits under [storage.options.overlay] (not the top options
# table) so the parsed graph option is "overlay.mount_program=..." -- the form
# buildah's build-context overlay recognizes, keeping `podman build` working
# through fuse too. See the main storage.conf for the full story.
[storage]
driver = "overlay"

[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"
