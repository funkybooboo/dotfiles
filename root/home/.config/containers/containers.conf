# Rootless podman engine config -- compose provider resolution.
#
# podman has no compose implementation of its own: `podman compose` shells out
# to an external provider. It walks compose_providers in order and runs the
# first one it can resolve (bare names are looked up on PATH, absolute paths are
# checked directly), so this single list covers both distros:
#
#   - Arch installs compose v2 as /usr/bin/docker-compose, matched by the bare
#     `docker-compose` entry.
#   - Debian/Ubuntu's docker-compose-v2 package installs compose ONLY as a
#     Docker CLI plugin at /usr/libexec/docker/cli-plugins/docker-compose and
#     puts nothing on PATH (the CLI-plugin convention dispatches via that
#     directory, not PATH). Without the absolute-path entry below, `podman
#     compose` finds no provider at all on Debian.
#   - podman-compose stays last as a fallback if neither binary is present.
#
# Setting this explicitly replaces podman's compiled-in default
# ["docker-compose", "podman-compose"], which is why that pair is repeated here
# rather than only adding the libexec path.
[engine]
compose_providers = [
    "docker-compose",
    "/usr/libexec/docker/cli-plugins/docker-compose",
    "podman-compose",
]
