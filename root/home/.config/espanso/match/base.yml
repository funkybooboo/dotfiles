# espanso matches -- linked by migration 000325-espanso.sh.
#
# `trigger` is the typed text, `replace` what lands. Triggers are prefixed with
# `:` so they cannot fire inside ordinary prose.
#
# App-specific matches (filter_class / filter_title) are NOT usable here:
# espanso implements them only through kdotool, which is KDE-only, so under
# Hyprland every match is global.

matches:
  - trigger: ":date"
    replace: "{{today}}"
    vars:
      - name: today
        type: date
        params:
          format: "%Y-%m-%d"

  - trigger: ":now"
    replace: "{{stamp}}"
    vars:
      - name: stamp
        type: date
        params:
          format: "%Y-%m-%d %H:%M"

  # Jira keys are written DOMO-nnnnnn constantly; this expands to the browse
  # URL prefix so only the number has to be typed.
  - trigger: ":jira"
    replace: "https://domoinc.atlassian.net/browse/DOMO-"

  # Required trailer on anything a person reads as a message from Nate
  # (Jira comments, PR review replies) -- see CLAUDE.md attribution rule.
  - trigger: ":botsig"
    replace: "-- By Nates Bot"

  # Steam launch options for Proton games (validated on AOE2DE 813780 and
  # Civ V 8930 with GE-Proton11-6). Launch options do NOT sync between
  # machines (steam-for-linux #10475), so type :steamopts into each game's
  # Properties -> Launch Options on every new install. EVDEV backend means
  # this also works inside Steam's own UI.
  - trigger: ":steamopts"
    replace: "gamescope -W 1920 -H 1080 -f -- gamemoderun %command%"
