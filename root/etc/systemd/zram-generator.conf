# zram0 swap device, created at boot by systemd-zram-setup@zram0.service.
# Deployed from ~/dotfiles by 000411-earlyoom-tuning.sh (previously this
# file was machine-local and untracked).
#
# zram is compressed RAM-backed swap: the kernel fills it aggressively
# under memory pressure, and its free percentage is what earlyoom's swap
# threshold watches. The zram-generator default of min(ram / 2, 4096) gave
# 4G, which filled to 100% during test-stack builds while 20+G of RAM was
# still in use, tripping earlyoom into killing the session. 8G buys headroom
# for exactly that build-swap pressure and costs nothing while idle (zram
# consumes RAM only for the pages it holds, compressed).

[zram0]
compression-algorithm = zstd
zram-size = min(ram / 2, 8192)
