# /etc/sysctl.d/99-hardening.conf -- deployed by migration 000070-kernel-hardening-sysctl.sh

kernel.kptr_restrict=2
kernel.dmesg_restrict=1
fs.protected_regular=2
fs.protected_fifos=2
fs.protected_symlinks=1
fs.protected_hardlinks=1
# 2, not 1: both values disable unprivileged BPF, and 2 additionally locks the
# knob until reboot. Nothing here needs unprivileged BPF -- bpftrace and the bcc
# tools require root regardless -- so the lock costs nothing, and Ubuntu already
# ships 2, where writing 1 would fail with EPERM.
kernel.unprivileged_bpf_disabled=2
net.core.bpf_jit_harden=2
