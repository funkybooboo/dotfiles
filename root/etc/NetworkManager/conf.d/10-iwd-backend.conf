[main]
# Keep systemd-resolved as the one resolver: /etc/resolv.conf points at its
# stub (deployed by archinstall), tailscale's CorpDNS configures it, and
# NetworkManager must push per-link DNS there too instead of racing the other
# two to write /etc/resolv.conf directly.
dns=systemd-resolved

# Disable NM's iwd profile-conversion writes (empty value = off). By default
# (iwd-config-path=auto) NM rewrites iwd's own network files in /var/lib/iwd
# with keyfile-converted copies of its wifi profiles, "overwriting existing
# files without preserving their contents" (man 5 NetworkManager.conf).
# Those rewrites poisoned the saved psks: wifi autoconnect at boot is iwd's
# job under this stack (wifi.iwd.autoconnect defaults true, so NM never
# initiates connections and its profiles are assumed-from-iwd, which are
# volatile /run copies), so corrupting a saved psk meant neither daemon
# connected after a reboot and the password had to be retyped every boot.
# iwd keeps sole ownership of the psk store; NM's profiles stay in /run and
# are rebuilt by assuming whatever iwd connects to.
iwd-config-path=

[device]
# iwd stays the wifi daemon under NetworkManager. The fleet has years of saved
# networks in /var/lib/iwd (machine-specific, never tracked in dotfiles); with
# iwd as the backend those keep connecting through the switch, and impala
# (000562) drives them through iwd's own D-Bus API (net.connman.iwd), while
# NetworkManager just assumes and configures IP/DNS on whatever iwd joins.
wifi.backend=iwd