[main]
# Keep systemd-resolved as the one resolver: /etc/resolv.conf points at its
# stub (deployed by archinstall), tailscale's CorpDNS configures it, and
# NetworkManager must push per-link DNS there too instead of racing the other
# two to write /etc/resolv.conf directly.
dns=systemd-resolved

[device]
# iwd stays the wifi daemon under NetworkManager. The fleet has years of saved
# networks in /var/lib/iwd (machine-specific, never tracked in dotfiles); with
# iwd as the backend those keep connecting through the switch, and impala
# (000562) manages them through NetworkManager's API.
wifi.backend=iwd